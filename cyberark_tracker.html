<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberArk Practice Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0f14;
  --surface: #151820;
  --surface2: #1c2030;
  --surface3: #232840;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --text: #e8eaf0;
  --text2: #8890a8;
  --text3: #555e78;
  --accent: #4f8ef7;
  --accent2: #3a6fd4;
  --green: #34c77b;
  --amber: #f5a623;
  --red: #f55a5a;
  --teal: #2ecfb3;
  --purple: #9b7ef8;
  --r: 8px;
  --r-lg: 12px;
  --font: 'DM Sans', sans-serif;
  --mono: 'DM Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; font-size: 14px; }

/* Layout */
.shell { display: flex; height: 100vh; overflow: hidden; }
.sidebar { width: 220px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 0; }
.sidebar-logo { padding: 20px 18px 16px; border-bottom: 1px solid var(--border); }
.sidebar-logo .brand { font-size: 13px; font-weight: 600; letter-spacing: .08em; color: var(--accent); text-transform: uppercase; }
.sidebar-logo .sub { font-size: 11px; color: var(--text3); margin-top: 2px; font-family: var(--mono); }
.sidebar-nav { flex: 1; padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; }
.nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--r); cursor: pointer; color: var(--text2); font-size: 13px; font-weight: 400; transition: all .15s; border: none; background: none; width: 100%; text-align: left; }
.nav-item:hover { background: var(--surface2); color: var(--text); }
.nav-item.active { background: var(--surface3); color: var(--accent); font-weight: 500; }
.nav-icon { width: 16px; height: 16px; flex-shrink: 0; opacity: .7; }
.nav-item.active .nav-icon { opacity: 1; }
.nav-section { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .1em; padding: 12px 10px 4px; font-weight: 500; }
.sidebar-footer { padding: 12px 10px; border-top: 1px solid var(--border); }
.main { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
.topbar { padding: 14px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--surface); flex-shrink: 0; }
.topbar-title { font-size: 15px; font-weight: 500; }
.topbar-meta { font-size: 12px; color: var(--text2); }
.content { flex: 1; overflow-y: auto; padding: 24px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--r); border: 1px solid var(--border2); background: var(--surface2); color: var(--text); font-size: 13px; font-weight: 400; cursor: pointer; transition: all .15s; font-family: var(--font); }
.btn:hover { background: var(--surface3); border-color: var(--border2); }
.btn-primary { background: var(--accent); border-color: var(--accent2); color: #fff; }
.btn-primary:hover { background: var(--accent2); }
.btn-sm { padding: 4px 10px; font-size: 12px; }

/* Badges */
.badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; }
.badge-blue { background: rgba(79,142,247,.15); color: #7aadff; }
.badge-teal { background: rgba(46,207,179,.15); color: #2ecfb3; }
.badge-amber { background: rgba(245,166,35,.15); color: #f5a623; }
.badge-purple { background: rgba(155,126,248,.15); color: #b89cff; }
.badge-green { background: rgba(52,199,123,.15); color: #34c77b; }
.badge-red { background: rgba(245,90,90,.15); color: #f55a5a; }
.badge-gray { background: rgba(255,255,255,.06); color: var(--text2); }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 18px 20px; }
.card-sm { padding: 12px 16px; }

/* Stats row */
.stats-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 20px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 14px 16px; }
.stat-label { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 6px; }
.stat-val { font-size: 24px; font-weight: 600; }
.stat-sub { font-size: 11px; color: var(--text3); margin-top: 3px; }

/* Tabs */
.tab-row { display: flex; gap: 4px; margin-bottom: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); padding: 4px; width: fit-content; }
.tab { padding: 6px 16px; border-radius: var(--r); cursor: pointer; font-size: 13px; color: var(--text2); border: none; background: none; font-family: var(--font); transition: all .15s; }
.tab:hover { color: var(--text); }
.tab.active { background: var(--surface3); color: var(--text); font-weight: 500; }

/* Project Table */
.proj-table { width: 100%; border-collapse: collapse; }
.proj-table th { text-align: left; padding: 8px 12px; font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; font-weight: 500; border-bottom: 1px solid var(--border); }
.proj-table td { padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.proj-table tr:last-child td { border-bottom: none; }
.proj-table tbody tr { cursor: pointer; transition: background .1s; }
.proj-table tbody tr:hover td { background: var(--surface2); }
.proj-table tbody tr.expanded td { background: var(--surface2); }

/* Progress */
.prog-wrap { display: flex; align-items: center; gap: 8px; }
.prog-bar { height: 4px; background: rgba(255,255,255,.06); border-radius: 2px; width: 80px; overflow: hidden; }
.prog-fill { height: 100%; border-radius: 2px; transition: width .3s; }

/* Task panel */
.task-panel-wrap { padding: 12px 16px 16px; background: var(--surface2); border-bottom: 1px solid var(--border); }
.activity-group { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 6px; overflow: hidden; }
.activity-header { display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; cursor: pointer; transition: background .1s; }
.activity-header:hover { background: var(--surface2); }
.activity-name { font-size: 13px; font-weight: 500; }
.activity-meta { display: flex; align-items: center; gap: 10px; }
.sub-list { border-top: 1px solid var(--border); }
.sub-row { display: grid; grid-template-columns: 1fr 130px 30px; gap: 8px; align-items: center; padding: 7px 12px 7px 24px; border-bottom: 1px solid rgba(255,255,255,.03); transition: background .1s; }
.sub-row:last-child { border-bottom: none; }
.sub-row:hover { background: var(--surface2); }
.sub-name { font-size: 12px; color: var(--text2); }
.chk { width: 16px; height: 16px; border: 1px solid var(--border2); border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 10px; transition: all .15s; flex-shrink: 0; }
.chk.done { background: var(--green); border-color: var(--green); color: #fff; }
input[type="date"].sub-date { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; color: var(--text2); font-size: 11px; padding: 2px 6px; font-family: var(--mono); width: 120px; }
input[type="date"].sub-date:focus { outline: none; border-color: var(--accent); }

/* Modal */
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 1000; align-items: center; justify-content: center; }
.modal-bg.open { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--r-lg); padding: 24px; width: 480px; max-width: 95vw; max-height: 90vh; overflow-y: auto; }
.modal h2 { font-size: 16px; font-weight: 600; margin-bottom: 18px; }
.form-row { margin-bottom: 12px; }
.form-label { font-size: 12px; color: var(--text2); display: block; margin-bottom: 5px; }
.form-input { width: 100%; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--r); color: var(--text); font-size: 13px; padding: 8px 12px; font-family: var(--font); transition: border .15s; }
.form-input:focus { outline: none; border-color: var(--accent); }
.form-input::placeholder { color: var(--text3); }
textarea.form-input { resize: vertical; min-height: 72px; }
.form-2col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
select.form-input option { background: var(--surface2); }

/* Customer page */
.cust-grid { display: grid; grid-template-columns: 260px 1fr; gap: 16px; height: calc(100vh - 120px); }
.cust-list { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); overflow: hidden; display: flex; flex-direction: column; }
.cust-list-header { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.cust-list-header span { font-size: 12px; font-weight: 500; color: var(--text2); text-transform: uppercase; letter-spacing: .06em; }
.cust-search { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r); color: var(--text); font-size: 12px; padding: 6px 10px; font-family: var(--font); margin: 10px 14px; width: calc(100% - 28px); }
.cust-search:focus { outline: none; border-color: var(--accent); }
.cust-list-body { flex: 1; overflow-y: auto; }
.cust-item { padding: 10px 14px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s; }
.cust-item:hover { background: var(--surface2); }
.cust-item.selected { background: var(--surface3); border-left: 2px solid var(--accent); }
.cust-item-name { font-size: 13px; font-weight: 500; }
.cust-item-meta { font-size: 11px; color: var(--text3); margin-top: 2px; display: flex; gap: 6px; align-items: center; }
.dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }

/* Customer detail */
.cust-detail { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); display: flex; flex-direction: column; overflow: hidden; }
.cust-detail-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; justify-content: space-between; flex-shrink: 0; }
.cust-name { font-size: 18px; font-weight: 600; }
.cust-detail-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); flex-shrink: 0; }
.cust-dtab { padding: 10px 18px; font-size: 13px; color: var(--text2); cursor: pointer; border-bottom: 2px solid transparent; transition: all .15s; border: none; background: none; font-family: var(--font); }
.cust-dtab:hover { color: var(--text); }
.cust-dtab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
.cust-detail-body { flex: 1; overflow-y: auto; padding: 20px; }

/* Info sections */
.info-section { margin-bottom: 20px; }
.info-section-title { font-size: 11px; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; font-weight: 500; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.info-field { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r); padding: 10px 12px; }
.info-field-label { font-size: 11px; color: var(--text3); margin-bottom: 4px; }
.info-field-val { font-size: 13px; color: var(--text); font-family: var(--mono); }
.info-field-val.editable { cursor: pointer; border-bottom: 1px dashed var(--border2); }
.info-field-val.editable:hover { color: var(--accent); }

/* Contacts */
.contact-card { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r); padding: 12px 14px; display: flex; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
.contact-avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex-shrink: 0; }
.contact-info { flex: 1; min-width: 0; }
.contact-name { font-size: 13px; font-weight: 500; }
.contact-role { font-size: 11px; color: var(--text3); margin-top: 1px; }
.contact-detail { font-size: 12px; color: var(--text2); margin-top: 4px; font-family: var(--mono); }

/* Documents */
.doc-row { display: flex; align-items: center; gap: 12px; padding: 9px 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r); margin-bottom: 6px; cursor: pointer; transition: border-color .15s; }
.doc-row:hover { border-color: var(--border2); }
.doc-icon { width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 13px; flex-shrink: 0; }
.doc-info { flex: 1; min-width: 0; }
.doc-name { font-size: 13px; font-weight: 500; }
.doc-meta { font-size: 11px; color: var(--text3); margin-top: 1px; }
.doc-status { font-size: 11px; padding: 2px 8px; border-radius: 20px; }

/* Infra */
.infra-table { width: 100%; border-collapse: collapse; }
.infra-table th { text-align: left; padding: 7px 10px; font-size: 11px; color: var(--text3); border-bottom: 1px solid var(--border); }
.infra-table td { padding: 8px 10px; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,.03); font-family: var(--mono); color: var(--text2); }
.infra-table tr:last-child td { border-bottom: none; }

/* Filter row */
.filter-row { display: flex; gap: 8px; margin-bottom: 14px; align-items: center; }
.filter-select { background: var(--surface2); border: 1px solid var(--border); border-radius: var(--r); color: var(--text2); font-size: 12px; padding: 5px 10px; font-family: var(--font); cursor: pointer; }
.filter-select:focus { outline: none; border-color: var(--accent); }

/* Empty state */
.empty { text-align: center; padding: 40px 20px; color: var(--text3); font-size: 13px; }

/* Scrollbar */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--surface3); border-radius: 2px; }

/* Avatar colors */
.av-blue { background: rgba(79,142,247,.2); color: #7aadff; }
.av-teal { background: rgba(46,207,179,.2); color: #2ecfb3; }
.av-purple { background: rgba(155,126,248,.2); color: #b89cff; }
.av-amber { background: rgba(245,166,35,.2); color: #f5a623; }
.av-coral { background: rgba(245,90,90,.2); color: #f58a8a; }
.av-green { background: rgba(52,199,123,.2); color: #34c77b; }
</style>
</head>
<body>

<div class="shell">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-logo">
      <div class="brand">CyberArk</div>
      <div class="sub">Practice Tracker v1.0</div>
    </div>
    <div class="sidebar-nav">
      <div class="nav-section">Views</div>
      <button class="nav-item active" onclick="showPage('dashboard')">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="1" width="6" height="6" rx="1"/><rect x="9" y="1" width="6" height="6" rx="1"/><rect x="1" y="9" width="6" height="6" rx="1"/><rect x="9" y="9" width="6" height="6" rx="1"/></svg>
        Dashboard
      </button>
      <button class="nav-item" onclick="showPage('projects')">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12M2 8h8M2 12h10"/></svg>
        Projects
      </button>
      <button class="nav-item" onclick="showPage('customers')">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="5" r="3"/><path d="M2 14c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg>
        Customers
      </button>
      <div class="nav-section">Filters</div>
      <button class="nav-item" onclick="showPage('projects');filterByType('Implementation')">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2L2 5v4c0 3 2.7 5.4 6 6 3.3-.6 6-3 6-6V5L8 2z"/></svg>
        Implementations
      </button>
      <button class="nav-item" onclick="showPage('projects');filterByType('Managed Service')">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="3"/><path d="M8 1v2M8 13v2M1 8h2M13 8h2"/></svg>
        Managed Services
      </button>
      <button class="nav-item" onclick="showPage('projects');filterByType('License Renewal')">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="12" height="12" rx="2"/><path d="M5 8l2 2 4-4"/></svg>
        License Renewals
      </button>
      <button class="nav-item" onclick="showPage('projects');filterByType('New Opportunity')">
        <svg class="nav-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 2l1.8 3.6L14 6.5l-3 2.9.7 4.1L8 11.4l-3.7 2.1.7-4.1-3-2.9 4.2-.9z"/></svg>
        New Opportunities
      </button>
    </div>
    <div class="sidebar-footer">
      <div style="font-size:11px;color:var(--text3)">Total Projects: <span id="total-count" style="color:var(--text2)">11</span></div>
      <div style="font-size:11px;color:var(--text3);margin-top:2px">Customers: <span id="cust-count" style="color:var(--text2)">11</span></div>
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <div>
        <div class="topbar-title" id="page-title">Dashboard</div>
        <div class="topbar-meta" id="page-sub">Overview of all projects</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <div style="font-size:12px;color:var(--text3);font-family:var(--mono)" id="today-date"></div>
        <button class="btn btn-primary btn-sm" onclick="openAddProject()">+ Add Project</button>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- Add/Edit Project Modal -->
<div class="modal-bg" id="proj-modal">
  <div class="modal">
    <h2 id="proj-modal-title">Add Project</h2>
    <div class="form-row"><label class="form-label">Customer name</label><input id="m-customer" class="form-input" placeholder="e.g. HDFC Bank"></div>
    <div class="form-row"><label class="form-label">Project type</label>
      <select id="m-type" class="form-input">
        <option>Implementation</option><option>Managed Service</option><option>License Renewal</option><option>New Opportunity</option>
      </select>
    </div>
    <div class="form-2col form-row">
      <div><label class="form-label">Owner</label><input id="m-owner" class="form-input" placeholder="Team member"></div>
      <div><label class="form-label">Status</label>
        <select id="m-status" class="form-input">
          <option>On Track</option><option>At Risk</option><option>Delayed</option><option>Completed</option><option>Prospecting</option>
        </select>
      </div>
    </div>
    <div class="form-2col form-row">
      <div><label class="form-label">Start date</label><input id="m-start" class="form-input" type="date"></div>
      <div><label class="form-label">Due date</label><input id="m-due" class="form-input" type="date"></div>
    </div>
    <div class="form-row"><label class="form-label">Notes / current milestone</label><input id="m-notes" class="form-input" placeholder="e.g. Phase 1 kick-off done"></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('proj-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveProject()">Save Project</button>
    </div>
  </div>
</div>

<!-- Add Contact Modal -->
<div class="modal-bg" id="contact-modal">
  <div class="modal">
    <h2>Add Contact</h2>
    <div class="form-row"><label class="form-label">Full name</label><input id="c-name" class="form-input" placeholder="e.g. Rajesh Kumar"></div>
    <div class="form-2col form-row">
      <div><label class="form-label">Role / designation</label><input id="c-role" class="form-input" placeholder="e.g. IT Manager"></div>
      <div><label class="form-label">Department</label><input id="c-dept" class="form-input" placeholder="e.g. Information Security"></div>
    </div>
    <div class="form-2col form-row">
      <div><label class="form-label">Email</label><input id="c-email" class="form-input" type="email" placeholder="name@company.com"></div>
      <div><label class="form-label">Phone</label><input id="c-phone" class="form-input" placeholder="+91 98xxx"></div>
    </div>
    <div class="form-row"><label class="form-label">Notes</label><input id="c-notes" class="form-input" placeholder="Decision maker / Technical POC / Approver..."></div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('contact-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveContact()">Save Contact</button>
    </div>
  </div>
</div>

<!-- Add Document Modal -->
<div class="modal-bg" id="doc-modal">
  <div class="modal">
    <h2>Add Document</h2>
    <div class="form-row"><label class="form-label">Document name</label><input id="d-name" class="form-input" placeholder="e.g. HLD – CyberArk Architecture v1.0"></div>
    <div class="form-2col form-row">
      <div><label class="form-label">Type</label>
        <select id="d-type" class="form-input">
          <option>HLD</option><option>LLD</option><option>SOP</option><option>Architecture Diagram</option><option>Network Diagram</option><option>Infra Details</option><option>Test Plan</option><option>UAT Sign-off</option><option>Other</option>
        </select>
      </div>
      <div><label class="form-label">Status</label>
        <select id="d-status" class="form-input">
          <option>Draft</option><option>In Review</option><option>Approved</option><option>Shared</option>
        </select>
      </div>
    </div>
    <div class="form-row"><label class="form-label">Link / path (SharePoint, Drive, etc.)</label><input id="d-link" class="form-input" placeholder="https://..."></div>

// ─── ROUTING ─────────────────────────────────────────────────────────────────
function showPage(p){
  currentPage=p;
  document.querySelectorAll(".nav-item").forEach(el=>el.classList.remove("active"));
  const map={dashboard:0,projects:1,customers:2};
  const items=document.querySelectorAll(".nav-item");
  if(map[p]!==undefined) items[map[p]].classList.add("active");
  const titles={dashboard:"Dashboard",projects:"Projects",customers:"Customers"};
  const subs={dashboard:"Overview of all projects",projects:"All project types with task tracking",customers:"Customer profiles, contacts & documents"};
  document.getElementById("page-title").textContent=titles[p]||p;
  document.getElementById("page-sub").textContent=subs[p]||"";
  render();
}

function filterByType(t){activeTab=t;render();}

function render(){
  updateCounts();
  const c=document.getElementById("content");
  if(currentPage==="dashboard") c.innerHTML=renderDashboard();
  else if(currentPage==="projects") c.innerHTML=renderProjects();
  else if(currentPage==="customers") c.innerHTML=renderCustomers();
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function taskProg(p){
  const all=p.tasks.reduce((a,g)=>a+g.subs.length,0);
  const done=p.tasks.reduce((a,g)=>a+g.subs.filter(s=>s.done).length,0);
  return all===0?0:Math.round(done/all*100);
}
function updateCounts(){
  document.getElementById("total-count").textContent=projects.length;
  document.getElementById("cust-count").textContent=[...new Set(projects.map(p=>p.customer))].length;
}
function fmtDate(d){if(!d)return "—";const dt=new Date(d);return dt.toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"});}
function statusDot(s){const m={"On Track":"var(--green)","At Risk":"var(--amber)",Delayed:"var(--red)",Completed:"var(--teal)",Prospecting:"var(--text3)"};return `<span class="dot" style="background:${m[s]||'var(--text3)'}"></span>`;}

// ─── DASHBOARD ───────────────────────────────────────────────────────────────

  const dueProjs=projects.filter(p=>{if(!p.due)return false;const d=new Date(p.due);const now=new Date();return (d-now)<30*24*3600*1000&&d>now;});

      <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
        <div>
          <div style="font-size:13px;font-weight:500">${p.customer}</div>
          <div style="font-size:11px;color:var(--text3)">${p.type} · ${p.owner}</div>

        <span class="badge ${STATUS_BADGE[p.status]}">${p.status}</span>

      <div class="info-section-title" style="margin-bottom:12px">Due in 30 days <span class="badge badge-amber">${dueProjs.length}</span></div>

          <div style="font-size:13px;font-weight:500">${p.customer}</div>
          <div style="font-size:11px;color:var(--text3)">${p.type}</div>
        </div>
        <div style="font-size:12px;color:var(--amber);font-family:var(--mono)">${fmtDate(p.due)}</div>

    <table class="proj-table">

      </tr>`}).join("")}

    </table>
  </div>`;

function renderTaskPanel(p,doneSubs,totalSubs){

      </div>
    </div>
    ${p.tasks.map((g,gi)=>{
      const gDone=g.subs.filter(s=>s.done).length;
      const gAll=g.subs.length;
      const gPct=Math.round(gDone/gAll*100);
      return `<div class="activity-group">
        <div class="activity-header" onclick="toggleGroup(${p.id},${gi})">
          <span class="activity-name">${g.name}</span>
          <div class="activity-meta">
            <span style="font-size:11px;color:var(--text3)">${gDone}/${gAll}</span>
            <div class="prog-bar" style="width:50px"><div class="prog-fill" style="width:${gPct}%;background:var(--green)"></div></div>
            <span style="font-size:12px;color:var(--text3)">${g.open?"▴":"▾"}</span>
          </div>
        </div>
        ${g.open?`<div class="sub-list">${g.subs.map((s,si)=>`
        <div class="sub-row">
          <span class="sub-name" style="${s.done?"text-decoration:line-through;opacity:.5":""}">${s.name}</span>
          <input type="date" class="sub-date" value="${s.due||""}" onchange="setSubDue(${p.id},${gi},${si},this.value)">
          <div class="chk ${s.done?"done":""}" onclick="toggleSub(${p.id},${gi},${si})">${s.done?"✓":""}</div>
        </div>`).join("")}</div>`:""}
      </div>`;
    }).join("")}
  </div>`;
}

// ─── CUSTOMERS ───────────────────────────────────────────────────────────────
function renderCustomers(){
  const allCustomers=[...new Set(projects.map(p=>p.customer))].sort();
  if(!selectedCustomer||!allCustomers.includes(selectedCustomer)) selectedCustomer=allCustomers[0];

  return `<div class="cust-grid">
    <div class="cust-list">
      <div class="cust-list-header"><span>Customers</span><span style="color:var(--text3)">${allCustomers.length}</span></div>
      <input class="cust-search" placeholder="Search customers..." oninput="filterCustList(this.value)">
      <div class="cust-list-body" id="cust-list-body">
        ${allCustomers.map(c=>{
          const proj=projects.find(p=>p.customer===c)||{};
          return `<div class="cust-item ${c===selectedCustomer?"selected":""}" onclick="selectCustomer('${c}')">
            <div class="cust-item-name">${c}</div>
            <div class="cust-item-meta">${statusDot(proj.status||"")}${proj.type||""} · ${proj.owner||""}</div>
          </div>`;
        }).join("")}
      </div>
    </div>
    <div class="cust-detail" id="cust-detail">
      ${renderCustomerDetail(selectedCustomer)}
    </div>
  </div>`;
}

function renderCustomerDetail(cname){
  if(!cname) return '<div class="empty">Select a customer</div>';
  const cust=ensureCustomer(cname);
  const proj=projects.find(p=>p.customer===cname)||{};
  const dtabs=["overview","contacts","documents","infra"];
  const tab=customerDetailTab;
  return `
  <div class="cust-detail-header">
    <div>
      <div class="cust-name">${cname}</div>
      <div style="display:flex;gap:8px;margin-top:6px">
        ${proj.type?`<span class="badge ${TYPE_BADGE[proj.type]||""}">${proj.type}</span>`:""}
        ${proj.status?`<span class="badge ${STATUS_BADGE[proj.status]||""}">${proj.status}</span>`:""}
      </div>
    </div>
    <div style="display:flex;gap:8px">
      ${tab==="contacts"?`<button class="btn btn-sm" onclick="openAddContact('${cname}')">+ Contact</button>`:""}
      ${tab==="documents"?`<button class="btn btn-sm" onclick="openAddDoc('${cname}')">+ Document</button>`:""}
      ${tab==="infra"?`<button class="btn btn-sm" onclick="openAddInfra('${cname}')">+ Server</button>`:""}
    </div>
  </div>
  <div class="cust-detail-tabs">
    ${dtabs.map(t=>`<button class="cust-dtab ${tab===t?"active":""}" onclick="customerDetailTab='${t}';refreshDetail('${cname}')">${t.charAt(0).toUpperCase()+t.slice(1)}</button>`).join("")}
  </div>
  <div class="cust-detail-body">
    ${tab==="overview"?renderCustOverview(cname,cust,proj):""}
    ${tab==="contacts"?renderCustContacts(cname,cust):""}
    ${tab==="documents"?renderCustDocs(cname,cust):""}
    ${tab==="infra"?renderCustInfra(cname,cust):""}
  </div>`;
}

function renderCustOverview(cname,cust,proj){
  const pr=cust.profile;
  const prog=proj.id?taskProg(proj):0;
  return `
  <div class="info-section">
    <div class="info-section-title">Project status</div>
    <div class="info-grid">
      <div class="info-field"><div class="info-field-label">Project type</div><div class="info-field-val">${proj.type||"—"}</div></div>
      <div class="info-field"><div class="info-field-label">Owner</div><div class="info-field-val">${proj.owner||"—"}</div></div>
      <div class="info-field"><div class="info-field-label">Status</div><div class="info-field-val">${proj.status||"—"}</div></div>
      <div class="info-field"><div class="info-field-label">Progress</div>
        <div class="info-field-val">
          <div class="prog-wrap"><div class="prog-bar" style="width:120px"><div class="prog-fill" style="width:${prog}%;background:${PROG_COLOR[proj.status]||"var(--text3)"}"></div></div><span style="font-size:12px;color:var(--text2)">${prog}%</span></div>
        </div>
      </div>
      <div class="info-field"><div class="info-field-label">Start date</div><div class="info-field-val">${fmtDate(proj.start)}</div></div>
      <div class="info-field"><div class="info-field-label">Due date</div><div class="info-field-val">${fmtDate(proj.due)}</div></div>
    </div>
  </div>
  <div class="info-section">
    <div class="info-section-title">Customer profile</div>
    <div class="info-grid">
      <div class="info-field"><div class="info-field-label">Industry</div><div class="info-field-val">${pr.industry||"—"}</div></div>
      <div class="info-field"><div class="info-field-label">CyberArk Tenant</div><div class="info-field-val">${pr.tenant||"—"}</div></div>
      <div class="info-field"><div class="info-field-label">Region / DC</div><div class="info-field-val">${pr.region||"—"}</div></div>
      <div class="info-field"><div class="info-field-label">Identity Provider (IdP)</div><div class="info-field-val">${pr.idp||"—"}</div></div>
      <div class="info-field"><div class="info-field-label">SIEM</div><div class="info-field-val">${pr.siem||"—"}</div></div>
      <div class="info-field"><div class="info-field-label">License type</div><div class="info-field-val">${pr.licenseType||"—"}</div></div>
      <div class="info-field"><div class="info-field-label">License count</div><div class="info-field-val">${pr.licenseCount||"—"}</div></div>
      <div class="info-field"><div class="info-field-label">License expiry</div><div class="info-field-val">${fmtDate(pr.licenseExpiry)}</div></div>
    </div>
    <button class="btn btn-sm" style="margin-top:10px" onclick="openEditProfile('${cname}')">Edit profile</button>
  </div>
  ${pr.notes?`<div class="info-section"><div class="info-section-title">Notes</div><div style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:12px;font-size:13px;color:var(--text2);line-height:1.6">${pr.notes}</div></div>`:""}
  `;
}

function renderCustContacts(cname,cust){
  if(!cust.contacts.length) return `<div class="empty" style="margin-top:40px">No contacts yet.<br><br><button class="btn" onclick="openAddContact('${cname}')">+ Add first contact</button></div>`;
  return cust.contacts.map(c=>`
  <div class="contact-card">
    <div class="contact-avatar ${AV_CLASSES[c.id%AV_CLASSES.length]}">${inits(c.name)}</div>
    <div class="contact-info">
      <div class="contact-name">${c.name}</div>
      <div class="contact-role">${c.role}${c.dept?" · "+c.dept:""}</div>
      ${c.email?`<div class="contact-detail">${c.email}</div>`:""}
      ${c.phone?`<div class="contact-detail">${c.phone}</div>`:""}
      ${c.notes?`<div style="font-size:11px;color:var(--text3);margin-top:4px">${c.notes}</div>`:""}
    </div>
    <button class="btn btn-sm" onclick="deleteContact('${cname}',${c.id})">Remove</button>
  </div>`).join("");
}

function renderCustDocs(cname,cust){
  const docIcon={HLD:"📐",LLD:"📋",SOP:"📝","Architecture Diagram":"🗺","Network Diagram":"🌐","Infra Details":"🖥","Test Plan":"🧪","UAT Sign-off":"✅",Other:"📄"};
  const docStatusBadge={Draft:"badge-gray","In Review":"badge-amber",Approved:"badge-green",Shared:"badge-blue"};
  if(!cust.documents.length) return `<div class="empty" style="margin-top:40px">No documents yet.<br><br><button class="btn" onclick="openAddDoc('${cname}')">+ Add first document</button></div>`;
  return `<div>
    ${["HLD","LLD","SOP","Architecture Diagram","Network Diagram","Infra Details","Test Plan","UAT Sign-off","Other"].map(type=>{
      const docs=cust.documents.filter(d=>d.type===type);
      if(!docs.length) return "";
      return `<div class="info-section"><div class="info-section-title">${type}</div>${docs.map(d=>`
      <div class="doc-row" onclick="${d.link?`window.open('${d.link}','_blank')`:"void(0)"}">
        <div class="doc-icon" style="background:var(--surface3)">${docIcon[d.type]||"📄"}</div>
        <div class="doc-info">
          <div class="doc-name">${d.name}</div>
          <div class="doc-meta">${d.notes||""}</div>
        </div>
        <span class="badge ${docStatusBadge[d.status]||"badge-gray"}">${d.status}</span>
        <button class="btn btn-sm" onclick="deleteDoc('${cname}',${d.id},event)">✕</button>
      </div>`).join("")}</div>`;
    }).join("")}
  </div>`;
}

function renderCustInfra(cname,cust){
  if(!cust.infra.length) return `<div class="empty" style="margin-top:40px">No infrastructure details yet.<br><br><button class="btn" onclick="openAddInfra('${cname}')">+ Add server</button></div>`;
  const envs=["Production","UAT","Dev","POC"];
  return envs.map(env=>{
    const rows=cust.infra.filter(i=>i.env===env);
    if(!rows.length) return "";
    return `<div class="info-section">
      <div class="info-section-title">${env} <span class="badge badge-gray">${rows.length} servers</span></div>
      <div style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden">
        <table class="infra-table" style="width:100%">
          <thead><tr><th>Hostname</th><th>IP</th><th>OS</th><th>Role</th><th>Notes</th><th></th></tr></thead>
          <tbody>
            ${rows.map(i=>`<tr>
              <td style="color:var(--accent);font-weight:500">${i.host}</td>
              <td>${i.ip}</td><td>${i.os}</td>
              <td><span class="badge badge-gray">${i.role}</span></td>
              <td style="color:var(--text3)">${i.notes||"—"}</td>
              <td><button class="btn btn-sm" onclick="deleteInfra('${cname}',${i.id})">✕</button></td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>`;
  }).join("");
}

// ─── ACTIONS ─────────────────────────────────────────────────────────────────
function toggleExpand(id){expandedId=(expandedId===id?null:id);render();}
function toggleGroup(pid,gi){const p=projects.find(x=>x.id===pid);p.tasks[gi].open=!p.tasks[gi].open;render();}
function toggleSub(pid,gi,si){const p=projects.find(x=>x.id===pid);p.tasks[gi].subs[si].done=!p.tasks[gi].subs[si].done;render();}
function setSubDue(pid,gi,si,v){const p=projects.find(x=>x.id===pid);p.tasks[gi].subs[si].due=v;}

function selectCustomer(c){selectedCustomer=c;customerDetailTab="overview";document.getElementById("cust-detail").innerHTML=renderCustomerDetail(c);document.querySelectorAll(".cust-item").forEach(el=>el.classList.toggle("selected",el.textContent.trim().startsWith(c)));}
function refreshDetail(c){document.getElementById("cust-detail").innerHTML=renderCustomerDetail(c);}
function filterCustList(q){document.querySelectorAll(".cust-item").forEach(el=>{el.style.display=el.textContent.toLowerCase().includes(q.toLowerCase())?"":"none"});}

// Project modal
function openAddProject(){editProjId=null;document.getElementById("proj-modal-title").textContent="Add Project";["m-customer","m-owner","m-notes"].forEach(id=>document.getElementById(id).value="");document.getElementById("m-type").value="Implementation";document.getElementById("m-status").value="On Track";document.getElementById("proj-modal").classList.add("open");}
function editProject(id,e){if(e)e.stopPropagation();editProjId=id;const p=projects.find(x=>x.id===id);document.getElementById("proj-modal-title").textContent="Edit Project";document.getElementById("m-customer").value=p.customer;document.getElementById("m-type").value=p.type;document.getElementById("m-owner").value=p.owner;document.getElementById("m-status").value=p.status;document.getElementById("m-start").value=p.start||"";document.getElementById("m-due").value=p.due||"";document.getElementById("m-notes").value=p.notes||"";document.getElementById("proj-modal").classList.add("open");}
function saveProject(){
  const customer=document.getElementById("m-customer").value.trim();
  if(!customer){alert("Customer name required");return;}
  const type=document.getElementById("m-type").value;
  const obj={customer,type,owner:document.getElementById("m-owner").value.trim(),status:document.getElementById("m-status").value,start:document.getElementById("m-start").value,due:document.getElementById("m-due").value,notes:document.getElementById("m-notes").value.trim()};
  if(editProjId){const idx=projects.findIndex(x=>x.id===editProjId);projects[idx]={...projects[idx],...obj};}
  else{projects.push({id:Date.now(),...obj,tasks:mkTasks(type)});ensureCustomer(customer);}
  closeModal("proj-modal");render();
}

// Contact modal
function openAddContact(cname){contactTargetCustomer=cname;["c-name","c-role","c-dept","c-email","c-phone","c-notes"].forEach(id=>document.getElementById(id).value="");document.getElementById("contact-modal").classList.add("open");}
function saveContact(){
  const name=document.getElementById("c-name").value.trim();
  if(!name){alert("Name required");return;}
  const cust=ensureCustomer(contactTargetCustomer);
  cust.contacts.push({id:Date.now(),name,role:document.getElementById("c-role").value.trim(),dept:document.getElementById("c-dept").value.trim(),email:document.getElementById("c-email").value.trim(),phone:document.getElementById("c-phone").value.trim(),notes:document.getElementById("c-notes").value.trim()});
  closeModal("contact-modal");refreshDetail(contactTargetCustomer);
}
function deleteContact(cname,id){const cust=ensureCustomer(cname);cust.contacts=cust.contacts.filter(c=>c.id!==id);refreshDetail(cname);}

// Doc modal
function openAddDoc(cname){docTargetCustomer=cname;["d-name","d-link","d-notes"].forEach(id=>document.getElementById(id).value="");document.getElementById("doc-modal").classList.add("open");}
function saveDocument(){
  const name=document.getElementById("d-name").value.trim();
  if(!name){alert("Document name required");return;}
  const cust=ensureCustomer(docTargetCustomer);
  cust.documents.push({id:Date.now(),name,type:document.getElementById("d-type").value,status:document.getElementById("d-status").value,link:document.getElementById("d-link").value.trim(),notes:document.getElementById("d-notes").value.trim()});
  closeModal("doc-modal");refreshDetail(docTargetCustomer);
}
function deleteDoc(cname,id,e){e&&e.stopPropagation();const cust=ensureCustomer(cname);cust.documents=cust.documents.filter(d=>d.id!==id);refreshDetail(cname);}

// Infra modal
function openAddInfra(cname){infraTargetCustomer=cname;["i-host","i-ip","i-os","i-notes"].forEach(id=>document.getElementById(id).value="");document.getElementById("infra-modal").classList.add("open");}
function saveInfra(){
  const host=document.getElementById("i-host").value.trim();
  if(!host){alert("Hostname required");return;}
  const cust=ensureCustomer(infraTargetCustomer);
  cust.infra.push({id:Date.now(),host,ip:document.getElementById("i-ip").value.trim(),os:document.getElementById("i-os").value.trim(),role:document.getElementById("i-role").value,env:document.getElementById("i-env").value,notes:document.getElementById("i-notes").value.trim()});
  closeModal("infra-modal");refreshDetail(infraTargetCustomer);
}
function deleteInfra(cname,id){const cust=ensureCustomer(cname);cust.infra=cust.infra.filter(i=>i.id!==id);refreshDetail(cname);}

// Profile edit (inline simple prompt approach for simplicity)
function openEditProfile(cname){
  const cust=ensureCustomer(cname);const pr=cust.profile;
  const fields=["industry","tenant","region","idp","siem","licenseType","licenseCount","licenseExpiry","notes"];
  const labels={"industry":"Industry","tenant":"CyberArk Tenant","region":"Region / DC","idp":"Identity Provider","siem":"SIEM","licenseType":"License Type","licenseCount":"License Count","licenseExpiry":"License Expiry (YYYY-MM-DD)","notes":"Notes"};
  // Build a simple inline edit modal
  const existing=document.getElementById("profile-modal");
  if(existing)existing.remove();
  const modal=document.createElement("div");
  modal.className="modal-bg open";modal.id="profile-modal";
  modal.innerHTML=`<div class="modal"><h2>Edit Profile – ${cname}</h2>${fields.map(f=>`<div class="form-row"><label class="form-label">${labels[f]}</label><input id="pf-${f}" class="form-input" value="${pr[f]||""}"></div>`).join("")}<div class="modal-footer"><button class="btn" onclick="document.getElementById('profile-modal').remove()">Cancel</button><button class="btn btn-primary" onclick="saveProfile('${cname}')">Save</button></div></div>`;
  document.body.appendChild(modal);
}
function saveProfile(cname){
  const cust=ensureCustomer(cname);
  ["industry","tenant","region","idp","siem","licenseType","licenseCount","licenseExpiry","notes"].forEach(f=>{cust.profile[f]=document.getElementById("pf-"+f).value.trim();});
  document.getElementById("profile-modal").remove();
  refreshDetail(cname);
}

function closeModal(id){document.getElementById(id).classList.remove("open");}
document.addEventListener("click",e=>{if(e.target.classList.contains("modal-bg"))e.target.classList.remove("open");});

// Init
document.getElementById("today-date").textContent=new Date().toLocaleDateString("en-IN",{weekday:"short",day:"2-digit",month:"short",year:"numeric"});
render();
</script>
</body>
</html>
